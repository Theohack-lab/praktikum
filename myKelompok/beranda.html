<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Kelompok Layout</title>
    <link rel="stylesheet" href="beranda.css">
</head>
<body>
    <header>
    <a class="logo" href="index.html">
        <img src="logo.png" style="height:100px">
    </a>

    <label for="nav-toggle" class="side-btn">☰</label>
    <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox">

    <nav class="sidebar" style="background-color: #30AFFF;">
        <div class="logo">
            <div class="navbar-nav d-flex flex-row gap-3 ms-auto">
                <a class="nav_link" href="#">Event</a>
                <a class="nav_link" href="#">Novel</a>
                <a class="nav_link" href="#">Anime</a>
                <a class="nav_link" href="#">Game</a>
                <a class="nav_link" href="#">Olahraga</a>
            </div>
        </div>
    </nav>
</header>

    <div class="container">
        
        <section class="trending-section">
            <h2 class="section-title">Sedang Tren</h2>
            
            <!-- Grid Rak Buku -->
            <div class="book-shelf">
                
                <!-- Item 1 -->
                <a href="https://trustpositif.laxo.net.id/" class="book-item" target="_blank" rel="noopener">
                    <div class="book-cover">
                        <img src="https://japanesestation.com/wp-content/uploads/2018/03/5abafb77cb4f7.jpg" alt="My Hero Academia">
                    </div>
                    <!-- GANTI TEKS DI BAWAH INI DENGAN JUDUL ANIME -->
                    <h5 class="book-title">My Hero Academia</h5>
                </a>

                <!-- Item 2 -->
                <a href="https://trustpositif.laxo.net.id/" class="book-item" target="_blank" rel="noopener">
                    <div class="book-cover">
                        <img src="https://awsimages.detik.net.id/community/media/visual/2026/08/11/anime-mushoku-tensei-jobless-reincarnation-1786446188399.webp?w=650&q=90" alt="mushoku">
                    </div>
                    <h5 class="book-title">Mushoku Tensei: Jobless Reincarnation Season 3</h5>
                </a>

                <!-- Item 3 -->
                <a href="https://trustpositif.laxo.net.id/" class="book-item" target="_blank" rel="noopener">
                    <div class="book-cover">
                        <img src="https://akcdn.detik.net.id/community/media/visual/2026/04/27/frieren-beyond-journeys-end-season-2-1777263959984_34.webp?w=375" alt="Judul Anime 3">
                    </div>
                    <h5 class="book-title">Frieren: Beyond Journey's End season 2</h5>
                </a>

                <!-- Item 4 -->
                <a href="https://trustpositif.laxo.net.id/" class="book-item" target="_blank" rel="noopener">
                    <div class="book-cover">
                        <img src="https://akcdn.detik.net.id/community/media/visual/2026/04/16/jujutsu-kaisen-1776307199938_34.jpeg?w=375" alt="Judul Anime 4">
                    </div>
                    <h5 class="book-title">Jujutsu Kaisen season 3</h5>

                </a>

                <!-- Item 5 -->
                <a href="https://trustpositif.laxo.net.id/" class="book-item" target="_blank" rel="noopener">
                    <div class="book-cover">
                        <img src="anime.jpg" alt="Judul Anime 5">
                    </div>
                    <h5 class="book-title">Yūnagi no Kanata e</h5>
                </a>

                <!-- Item 6 -->
                <a href="https://trustpositif.laxo.net.id/" class="book-item" target="_blank" rel="noopener">
                    <div class="book-cover">
                        <img src="https://a.ltrbxd.com/resized/film-poster/6/3/7/7/3/7/637737-yosuga-no-sora-0-2000-0-3000-crop.jpg?v=f9a49ea442" alt="Judul Anime 6">
                    </div>
                    <h5 class="book-title">Yosuga no Sora</h5>
                </a>

            </div>
        </section>

        <!-- Bagian Kategori -->
        <section class="category-section">
            <h2 class="section-title">Kategori</h2>
            <div class="category-buttons">
                <button class="btn-category">Anime</button>
                <button class="btn-category">Game</button>
                <button class="btn-category">Novel</button>
                <button class="btn-category">Komik</button>
                <button class="btn-category">Event</button>
            </div>
        </section>

    </div>



    <!-- Footer -->
    <footer>
        &copy; 2026 My Kelompok
    </footer>

</body>
</html>
